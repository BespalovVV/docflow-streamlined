name: CI/CD Pipeline - Автоматическое тестирование и Бесшовный Деплой

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Целевое окружение для деплоя'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # ==============================================================
  # ЭТАП 1: ТЕСТИРОВАНИЕ И ПРОВЕРКА БЕЗОПАСНОСТИ
  # ==============================================================
  test:
    name: 🧪 Автоматические тесты (RBAC, Security, Integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow_secure_pass
          POSTGRES_DB: docflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow -d docflow_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ⚙️ Настройка Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Установка зависимостей
        run: npm ci

      - name: 🚀 Запуск сервера и тестового пакета (RBAC, Security, SSO, БД)
        env:
          NODE_ENV: test
          PORT: 3000
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: docflow
          PGPASSWORD: docflow_secure_pass
          PGDATABASE: docflow_db
          JWT_SECRET: ci_cd_test_secret_key_2026_super_secure
          TEST_APP_URL: http://127.0.0.1:3000
        run: |
          node backend/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Server is ready"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server exited prematurely"
              exit 1
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3000/api/health > /dev/null
          npm test
          node backend/tests/sso_labspace_integration.test.js
          node backend/tests/rbac_db_and_sso_edit.test.js

  # ==============================================================
  # ЭТАП 2: СБОРКА DOCKER ОБРАЗОВ
  # ==============================================================
  build:
    name: 🐳 Сборка и проверка Docker образа
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ⚙️ Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Тестовая сборка Docker образа с кэшированием
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: docflow-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================
  # ЭТАП 3: БЕСШОВНОЕ РАЗВЕРТЫВАНИЕ НА СЕРВЕРЕ (ZERO-DOWNTIME DEPLOY)
  # ==============================================================
  deploy:
    name: 🚀 Бесшовный деплой на Production сервер
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: 🔍 Проверка секретов Production-сервера
        id: check_secrets
        env:
          HAS_HOST: ${{ secrets.PROD_SERVER_HOST != '' }}
          HAS_USER: ${{ secrets.PROD_SERVER_USER != '' }}
          HAS_KEY: ${{ secrets.PROD_SERVER_SSH_KEY != '' }}
        run: |
          if [ "$HAS_HOST" = "true" ] && [ "$HAS_USER" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔑 Подключение по SSH и запуск бесшовного обновления
        if: steps.check_secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 Запуск процесса бесшовного обновления DocFlow..."
            echo "=========================================================="
            cd /opt/docflow-streamlined || cd ~/docflow-streamlined
            chmod +x deploy.sh
            ./deploy.sh

      - name: ℹ️ Деплой пропущен (секреты Production-сервера ещё не заданы)
        if: steps.check_secrets.outputs.ready != 'true'
        run: |
          echo "Добавьте PROD_SERVER_HOST, PROD_SERVER_USER и PROD_SERVER_SSH_KEY в Settings -> Secrets -> Actions для автодеплоя по SSH."
