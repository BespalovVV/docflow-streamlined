<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DocFlow — Редактор ONLYOFFICE</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/icons.js?v=20261126_01"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .df-ico { display: inline-block; width: 15px; height: 15px; vertical-align: -0.15em; flex-shrink: 0; color: currentColor; stroke: currentColor; fill: none; }
    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .floating-back-btn {
      position: fixed;
      top: 6px;
      left: 10px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 500;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.2s ease, transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .floating-back-btn:hover {
      opacity: 1;
      background: rgba(30, 41, 59, 0.95);
      transform: translateY(-1px);
    }
    .top-bar {
      display: none;
    }
    #editor-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #ffffff;
      position: relative;
    }
    #onlyoffice-placeholder {
      width: 100%;
      height: 100%;
    }
    .loading-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #94a3b8;
      gap: 12px;
      font-size: 14px;
      z-index: 50;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-box {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      padding: 16px 20px;
      border-radius: 8px;
      max-width: 480px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="app">
    <button id="btn-back" class="floating-back-btn" title="Вернуться в DocFlow">← В портал</button>
    <div id="doc-title-text" style="display: none;"></div>
    <button id="btn-save-doc" style="display: none;"></button>

    <div id="editor-wrapper">
      <div id="loading-overlay" class="loading-state">
        <div class="spinner"></div>
        <div id="loading-text">Подключение к серверу ONLYOFFICE Docs...</div>
      </div>
      <div id="onlyoffice-placeholder"></div>
    </div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const docId = urlParams.get('id');
      const token = localStorage.getItem('docflow_token') || sessionStorage.getItem('docflow_token');

      const escapeHtml = (str) => String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const authHeaders = token ? { 'Authorization': `Bearer ${token}` } : {};

      if (!docId) {
        document.getElementById('loading-overlay').innerHTML = `
          <div class="error-box">
            <h3>Ошибка: ID документа не указан</h3>
            <p style="margin-top: 8px;"><a href="/#documents" style="color: #60a5fa;">Вернуться в реестр документов</a></p>
          </div>
        `;
        return;
      }

      // Detection
      const isMobileByScreen = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      let currentType = isMobileByScreen ? 'mobile' : 'desktop';
      let docEditorInstance = null;
      let cachedConfig = null;
      let isDocModified = false;

      const titleEl = document.getElementById('doc-title-text');
      const backBtn = document.getElementById('btn-back');
      const saveBtn = document.getElementById('btn-save-doc');
      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingText = document.getElementById('loading-text');

      async function triggerSaveNow() {
        if (!docId) return false;
        try {
          const res = await fetch(`/api/documents/${docId}/save-now`, {
            method: 'POST',
            credentials: 'same-origin',
            headers: authHeaders
          });
          if (res.ok) {
            isDocModified = false;
            return true;
          }
        } catch (e) {
          console.warn('Save-now failed:', e);
        }
        return false;
      }

      if (saveBtn) {
        const ico = (d) => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;margin-right:4px" aria-hidden="true">${d}</svg>`;
        const ICO_CLOCK = ico('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>');
        const ICO_CHECK = ico('<circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/>');
        const ICO_SAVE = ico('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>');
        const ICO_WARN = ico('<path d="m10.29 3.86-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.71-3l-8-14a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>');
        saveBtn.addEventListener('click', async () => {
          saveBtn.disabled = true;
          saveBtn.innerHTML = `${ICO_CLOCK} Сохранение...`;
          const ok = await triggerSaveNow();
          saveBtn.disabled = false;
          if (ok) {
            saveBtn.style.background = '';
            saveBtn.style.borderColor = '';
            saveBtn.innerHTML = `${ICO_CHECK} Сохранено`;
            setTimeout(() => {
              if (saveBtn && !isDocModified) saveBtn.innerHTML = `${ICO_SAVE} Сохранить`;
            }, 2500);
          } else {
            saveBtn.innerHTML = `${ICO_WARN} Ошибка сохранения`;
          }
        });
      }

      backBtn.addEventListener('click', async () => {
        if (isDocModified) {
          const wantSave = confirm('В документе есть несохранённые изменения.\n\nСохранить внесённые правки перед выходом?');
          if (wantSave) {
            backBtn.textContent = 'Сохранение...';
            await triggerSaveNow();
          }
        }

        window.onbeforeunload = null;
        if (window.opener && !window.opener.closed) {
          window.close();
        } else {
          window.location.href = '/#documents';
        }
      });

      async function fetchConfig() {
        loadingText.textContent = 'Получение прав и конфигурации документа...';
        const res = await fetch(`/api/documents/${docId}/onlyoffice-config`, {
          credentials: 'same-origin',
          headers: authHeaders
        });

        if (res.status === 401) {
          window.location.href = '/';
          throw new Error('Требуется авторизация');
        }

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }

        return await res.json();
      }

      async function loadScriptWithRetry(primaryUrl, fallbackUrl, retries = 3, delayMs = 1200) {
        if (window.DocsAPI) return Promise.resolve();

        const urlsToTry = [primaryUrl];
        if (fallbackUrl && fallbackUrl !== primaryUrl) urlsToTry.push(fallbackUrl);

        for (const url of urlsToTry) {
          for (let attempt = 1; attempt <= retries; attempt++) {
            try {
              if (attempt > 1 && loadingText) {
                loadingText.textContent = `Подключение к ONLYOFFICE Docs (попытка ${attempt}/${retries})...`;
              }
              await loadScript(url);
              if (window.DocsAPI) return;
            } catch (err) {
              if (attempt === retries && url === urlsToTry[urlsToTry.length - 1]) throw err;
              await new Promise(r => setTimeout(r, delayMs));
            }
          }
        }
      }

      function loadScript(url) {
        if (window.DocsAPI) return Promise.resolve();
        document.querySelectorAll(`script[data-onlyoffice-api]`).forEach(s => s.remove());
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.setAttribute('data-onlyoffice-api', 'true');
          s.onload = resolve;
          s.onerror = () => reject(new Error('Не удалось загрузить ONLYOFFICE API (' + url + ')'));
          document.head.appendChild(s);
        });
      }

      function initEditor(config) {
        if (docEditorInstance) {
          try {
            docEditorInstance.destroyEditor();
          } catch(e) {}
          docEditorInstance = null;
        }

        const wrapper = document.getElementById('editor-wrapper');
        const existingPlaceholder = document.getElementById('onlyoffice-placeholder');
        if (existingPlaceholder) existingPlaceholder.remove();
        const newPlaceholder = document.createElement('div');
        newPlaceholder.id = 'onlyoffice-placeholder';
        wrapper.appendChild(newPlaceholder);

        loadingOverlay.style.display = 'flex';
        loadingText.textContent = 'Инициализация редактора...';

        try {
          docEditorInstance = new DocsAPI.DocEditor('onlyoffice-placeholder', {
            type: currentType,
            documentType: config.documentType,
            document: config.document,
            editorConfig: {
              ...config.editorConfig,
              customization: {
                ...(config.editorConfig?.customization || {}),
                compactHeader: true,
                compactToolbar: currentType === 'mobile'
              }
            },
            events: {
              onAppReady: function() {
                loadingOverlay.style.display = 'none';
              },
              onDocumentStateChange: function(event) {
                isDocModified = Boolean(event.data);
                if (saveBtn) {
                  const ICO_SAVE_SM = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;margin-right:4px" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>';
                  if (isDocModified) {
                    saveBtn.style.background = '#2563eb';
                    saveBtn.style.borderColor = '#3b82f6';
                    saveBtn.innerHTML = `${ICO_SAVE_SM} Сохранить *`;
                  } else {
                    saveBtn.style.background = '';
                    saveBtn.style.borderColor = '';
                    saveBtn.innerHTML = `${ICO_SAVE_SM} Сохранить`;
                  }
                }
              },
              onError: function(event) {
                console.error('ONLYOFFICE error event:', event);
                if (event?.data?.errorCode === -5 || event?.data === -5 || (event?.data?.errorDescription && /version/i.test(event.data.errorDescription))) {
                  console.log('[Editor] Version mismatch detected. Reloading editor session...');
                  setTimeout(() => location.reload(), 600);
                }
              }
            },
            height: '100%',
            width: '100%'
          });

          setTimeout(() => {
            if (loadingOverlay) loadingOverlay.style.display = 'none';
          }, 4000);

        } catch (err) {
          loadingOverlay.innerHTML = `
            <div class="error-box">
              <h3>Ошибка запуска редактора</h3>
              <p style="margin-top: 8px;">${escapeHtml(err.message)}</p>
            </div>
          `;
        }
      }

      async function start() {
        try {
          const config = await fetchConfig();
          cachedConfig = config;
          titleEl.textContent = config.document.title;
          document.title = `${config.document.title} — ONLYOFFICE Docs`;

          loadingText.textContent = 'Загрузка библиотеки ONLYOFFICE...';
          await loadScriptWithRetry(config.onlyofficeApiUrl, config.onlyofficeDirectUrl);

          initEditor(config);
        } catch (err) {
          let healthNote = '';
          try {
            const hRes = await fetch('/api/documents/onlyoffice-health');
            const health = await hRes.json();
            if (health.ok) {
              healthNote = `<p style="margin-top: 8px; color: #4ade80; font-size: 12px;">Служба ONLYOFFICE активна (${Number(health.latencyMs) || 0}мс). Попробуйте обновить страницу.</p>`;
            } else {
              healthNote = `<p style="margin-top: 8px; color: #f87171; font-size: 12px;">Статус ONLYOFFICE: ${escapeHtml(health.error || 'не отвечает')}</p>`;
            }
          } catch (e) {}

          loadingOverlay.innerHTML = `
            <div class="error-box">
              <h3>Не удалось открыть документ</h3>
              <p style="margin-top: 8px;">${escapeHtml(err.message)}</p>
              ${healthNote}
              <p style="margin-top: 14px; display: flex; gap: 8px; justify-content: center;">
                <button onclick="location.reload()" class="btn btn-secondary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;margin-right:4px" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg> Повторить попытку</button>
                <a href="/#documents" class="btn btn-secondary">Вернуться к списку</a>
              </p>
            </div>
          `;
        }
      }

      start();
    })();
  </script>
</body>
</html>
