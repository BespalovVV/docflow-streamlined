# ==============================================================================
# DOCFLOW STREAMLINED: ВЫСОКОПРОИЗВОДИТЕЛЬНАЯ КОНФИГУРАЦИЯ NGINX REVERSE-PROXY
# ==============================================================================
# Возможности:
# 1. Zero-Downtime upstream с keepalive и автоматическим повтором (failover)
# 2. Поддержка постоянных соединений Server-Sent Events (SSE) без буферизации
# 3. Полная поддержка WebSockets для ONLYOFFICE Docs и корпоративного мессенджера
# 4. Аппаратное сжатие Gzip (ускорение загрузки интерфейса на мобильных устройствах)
# 5. Кэширование статических ассетов (CSS, JS, Fonts, SVG)
# 6. Защитные заголовки HSTS, Clickjacking, MIME-Sniffing
# ==============================================================================

# Пул upstream-соединений к приложению DocFlow
upstream docflow_app_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Пул upstream к ONLYOFFICE Document Server
upstream docflow_onlyoffice_upstream {
    server 127.0.0.1:28083;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# 1. HTTP Сервер: Принудительный редирект на HTTPS и ACME Certbot challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name docflow.local docflow.mycompany.ru;

    # Директория для валидации Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Постоянный редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Сервер: Основной портал DocFlow Streamlined
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docflow.local docflow.mycompany.ru;

    # SSL Сертификаты (замените на пути вашего Let's Encrypt или корпоративного УЦ)
    ssl_certificate /etc/letsencrypt/live/docflow.mycompany.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docflow.mycompany.ru/privkey.pem;

    # Современные безопасные параметры SSL/TLS (Mozilla Modern/Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Заголовки повышенной безопасности
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Лимиты загрузки (до 100 МБ для сканов и больших документов)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Сжатие Gzip для ускорения мобильного интернета
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # --------------------------------------------------------------------------
    # Кэширование статических ресурсов SPA (CSS, JS, Fonts)
    # --------------------------------------------------------------------------
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass http://docflow_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # SSO (Authorization Code): не логировать параметры callback и заголовок Authorization
    # --------------------------------------------------------------------------
    location ^~ /api/sso/ {
        proxy_pass http://docflow_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # Server-Sent Events (SSE) для мгновенных уведомлений и чата
    # --------------------------------------------------------------------------
    location /api/messenger/events {
        proxy_pass http://docflow_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # КРИТИЧНО ДЛЯ SSE: отключение буферизации
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # --------------------------------------------------------------------------
    # Проксирование ONLYOFFICE Document Server (WebSockets + API)
    # --------------------------------------------------------------------------
    location /onlyoffice/ {
        proxy_pass http://docflow_onlyoffice_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # Основной прокси-маршрут приложения DocFlow с Zero-Downtime Failover
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://docflow_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Автоматический бесшовный повтор запроса при кратковременной ротации контейнера
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Таймауты ожидания ответа
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
